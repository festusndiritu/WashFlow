<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WashFlow</title>
    <meta name="description" content="Laundry business management platform" />
    <meta name="theme-color" content="#f97316" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="shortcut icon" href="/icon-192.png" />

    <!-- PWA / installable -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WashFlow" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="WashFlow" />
    <meta property="og:description" content="Laundry business management platform" />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />
    <!-- Prevent flash of wrong theme on load -->
    <script>
      ;(function(){
        try {
          var s = JSON.parse(localStorage.getItem('washflow-theme') || '{}')
          var m = s.state && s.state.mode
          var dark = m === 'dark' || ((!m || m === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch(e){}
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        #app-loader{display:flex;align-items:center;justify-content:center;flex-direction:column;height:100vh;background:#fafaf9}
        html.dark #app-loader{background:#1c1917}
        #app-loader .spinner{width:36px;height:36px;border:3px solid #e7e5e4;border-top-color:#f97316;border-radius:50%;animation:spin .7s linear infinite}
        html.dark #app-loader .spinner{border-color:#44403c;border-top-color:#f97316}
        #app-loader .label{font-family:system-ui,sans-serif;font-size:13px;color:#a8a29e;margin-top:12px}
        @keyframes spin{to{transform:rotate(360deg)}}
      </style>
      <div id="app-loader">
        <div class="spinner"></div>
        <div class="label">Loading WashFlow…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
