<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WashFlow</title>
    <meta name="description" content="Laundry business management platform" />
    <meta name="theme-color" content="#f97316" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="shortcut icon" href="/icon-192.png" />

    <!-- PWA / installable -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WashFlow" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="WashFlow" />
    <meta property="og:description" content="Laundry business management platform" />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />
    <!-- Prevent flash of wrong theme on load -->
    <script>
      ;(function(){
        try {
          var s = JSON.parse(localStorage.getItem('washflow-theme') || '{}')
          var m = s.state && s.state.mode
          var dark = m === 'dark' || ((!m || m === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch(e){}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
